name: Startup Office Synthetic Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startup-office-synthetic-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.STARTUP_OFFICE_PRODUCTION_JOBS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run deployed Startup Office synthetic flow
        env:
          LAF_SYNTHETIC_API_BASE_URL: ${{ vars.LAF_SYNTHETIC_API_BASE_URL || vars.LAF_OFFICE_PUBLIC_HOST }}
          LAF_SYNTHETIC_APPROVAL_ACTION: ${{ vars.LAF_SYNTHETIC_APPROVAL_ACTION || 'approve' }}
          LAF_SYNTHETIC_EMAIL: ${{ secrets.LAF_SYNTHETIC_EMAIL }}
          LAF_SYNTHETIC_LOOP_ID: ${{ vars.LAF_SYNTHETIC_LOOP_ID || 'idea-validation' }}
          LAF_SYNTHETIC_PASSWORD: ${{ secrets.LAF_SYNTHETIC_PASSWORD }}
          LAF_SYNTHETIC_TIMEOUT_MS: ${{ vars.LAF_SYNTHETIC_TIMEOUT_MS || '60000' }}
        run: npm run startup-office:synthetic-monitor
