name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-saas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install root tooling
        run: bun install --frozen-lockfile

      - name: Install web tooling
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run Startup Office release gate
        run: npm run beta:release-gate

      - name: Verify web app
        working-directory: web
        run: |
          npm --prefix .. run startup-office:web-lint-budget
          npm run typecheck
          npm run build
