commit-msg:
  commands:
    commitlint:
      run: bunx --bun commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    secretlint:
      run: bunx --bun secretlint {staged_files}
      exclude:
        - "node_modules/**"
        - "web/dist/**"
        - "web/node_modules/**"
        - "bun.lock"
        - "web/bun.lock"

    biome:
      root: web
      glob: "**/*.{js,ts,jsx,tsx,json,css}"
      run: bunx --bun biome check --write --max-diagnostics=500 {staged_files}
      stage_fixed: true
      exclude:
        - "dist/**"
        - "node_modules/**"
        - "bun.lock"
        - "web/bun.lock"
        - "**/*.gen.ts"
        - "**/*.gen.tsx"

    no-secrets:
      run: sh scripts/check-staged-safety.sh no-secrets

    check-merge-conflicts:
      glob: "*.{js,ts,jsx,tsx,css,yml,yaml,md,toml,json,sql,cjs,mjs}"
      run: sh scripts/check-staged-safety.sh merge-conflicts

    no-large-files:
      run: sh scripts/check-staged-safety.sh no-large-files

pre-push:
  parallel: false
  commands:
    hosted-release-gate:
      run: npm run beta:release-gate
