name: Release

on:
  push:
    tags:
      - "v*"
  # workflow_dispatch lets auto-release.yml trigger this workflow via
  # `gh workflow run release.yml --ref <tag>`. A push tag event created with
  # GITHUB_TOKEN does not fire other workflows, but workflow_dispatch does.
  workflow_dispatch:

# Default to least-privilege; per-job blocks below add only what each job
# actually needs. The release job uploads artifacts (contents: write); npm
# publish + npx smoke only need to read the repo.
permissions:
  contents: read

# Don't cancel an in-flight release: a partially-finished goreleaser leaves
# orphan release assets, and a partial npm publish leaves a half-shipped
# version. Two concurrent releases for the same tag can't be valid anyway —
# tags are immutable; the second invocation has nothing new to ship.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Env gate sits on the FIRST job that ships anything (goreleaser uploads
    # GitHub Release artifacts). Putting it on `publish-npm` instead would
    # leave a published GitHub Release with no corresponding npm package on
    # rejection, requiring manual cleanup. Pausing here means the human approves
    # the native release and npm publish surface together.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/laf-bridge
    permissions:
      contents: write
    outputs:
      npm_tag: ${{ steps.version.outputs.npm_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify releasable tree
        run: |
          missing=0
          for path in go.mod cmd/laf-office/main.go cmd/laf-bridge/main.go npm/package.json npm-bridge/package.json web/bun.lock; do
            if [ ! -e "$path" ]; then
              echo "::error::missing ${path}; refusing to build or publish this tag"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          VERSION="${REF#v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$ ]]; then
            echo "::error::release tag must be canonical npm-compatible SemVer without build metadata, got '${REF}'"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG=next
          else
            NPM_TAG=latest
          fi
          echo "npm_tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Preflight npm publish readiness
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          missing_publish=0
          tag_update_needed=0
          for package in laf-bridge laf-office; do
            if npm view "${package}@${VERSION}" version >/dev/null 2>&1; then
              echo "::notice::${package}@${VERSION} is already published; publish step will skip it"
            else
              missing_publish=1
            fi

            tag_version="$(npm view "${package}@${NPM_TAG}" version 2>/dev/null || true)"
            if [ "$tag_version" != "$VERSION" ]; then
              tag_update_needed=1
              echo "::notice::${package}@${NPM_TAG} currently resolves to ${tag_version:-<unpublished>}; publish step will set ${NPM_TAG} to ${VERSION}"
            fi
          done

          if [ "$missing_publish" -eq 1 ] || [ "$tag_update_needed" -eq 1 ]; then
            if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
              echo "::error::NPM_TOKEN is required before publishing or updating npm dist-tags for laf-bridge/laf-office"
              exit 1
            fi
            npm whoami >/dev/null
            npm ping
          fi

      - name: Set npm package version
        working-directory: npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Set LAF Bridge npm package version
        working-directory: npm-bridge
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Dry-run npm publish artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
        shell: bash
        run: |
          set -euo pipefail
          (cd npm-bridge && npm publish --dry-run --access public --tag "$NPM_TAG")
          (cd npm && npm publish --dry-run --access public --tag "$NPM_TAG")

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test LAF Bridge npm entrypoint
        run: |
          npm run bridge-only:surface
          npm run hosted-bridge:schema
          npm run hosted-bridge:ops:test
          npm run laf-bridge:package:test
          npm run hosted-bridge:smoke:test
          npm run hosted-bridge:smoke:integration

      # Pin to full SHA: third-party action, runs with write access to
      # contents (release upload). Same SHA is reused across all web-facing
      # workflows — keep them in sync.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.1.38"

      - name: Build React frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - run: go test ./...

      - uses: goreleaser/goreleaser-action@e24998b8b67b290c2fa8b7c14fcfa7de2c5c9b8c # ratchet:goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # npm publish runs after goreleaser because the packages lazy-download
      # binaries from that GitHub Release. Publish laf-bridge first so the
      # hosted Bridge setup flow cannot be left behind a fresh laf-office release.
      # Each publish is idempotent for manual retry after a partial registry
      # failure.
      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          add_dist_tag_with_retry() {
            local package="$1"
            for attempt in 1 2 3 4 5 6; do
              if npm dist-tag add "${package}@${VERSION}" "$NPM_TAG"; then
                return 0
              fi
              echo "::warning::npm dist-tag add ${package}@${VERSION} ${NPM_TAG} attempt ${attempt} failed; waiting for npm registry propagation"
              sleep 20
            done
            npm dist-tag add "${package}@${VERSION}" "$NPM_TAG"
          }

          publish_and_tag() {
            local package="$1"
            local directory="$2"
            if npm view "${package}@${VERSION}" version >/dev/null 2>&1; then
              echo "::notice::${package}@${VERSION} is already published; skipping"
            else
              (cd "$directory" && npm publish --access public --tag "$NPM_TAG")
            fi
            add_dist_tag_with_retry "$package"
          }

          publish_and_tag laf-bridge npm-bridge
          publish_and_tag laf-office npm

  smoke-test-npx:
    needs: [release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      NPM_TAG: ${{ needs.release.outputs.npm_tag }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: "20"

      - name: Wait for npm registry propagation
        shell: bash
        run: sleep 45

      - name: Smoke developer bootstrap npm wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # The binary's self-reported version must match the tag. Without
          # this check, a goreleaser misconfiguration (missing -X ldflag on
          # buildinfo.Version) silently ships the hardcoded fallback and no
          # exact-version `npx laf-office@$VERSION` gets developer-bootstrap
          # users the real release.
          OUT=$(npx --yes "laf-office@$VERSION" --version)
          echo "$OUT"
          echo "$OUT" | grep -E -q " v${VERSION}([[:space:]]|$)" || {
            echo "::error::binary self-reported version did not match tag $VERSION"
            echo "output was: $OUT"
            exit 1
          }
          if [ "$NPM_TAG" = "latest" ]; then
            LATEST_OUT=$(npx --yes laf-office@latest --version)
            echo "$LATEST_OUT"
            echo "$LATEST_OUT" | grep -E -q " v${VERSION}([[:space:]]|$)" || {
              echo "::error::laf-office@latest did not resolve to release $VERSION"
              echo "output was: $LATEST_OUT"
              exit 1
            }
          fi

      - name: Verify published LAF Bridge release gate
        shell: bash
        run: |
          verify_bridge_package() {
            local package="$1"
            shift
            for attempt in 1 2 3 4 5 6; do
              if node scripts/hosted-bridge-release-gate.cjs --package "$package" "$@"; then
                return 0
              fi
              echo "::warning::${package} release gate attempt ${attempt} failed; waiting for npm registry propagation"
              sleep 20
            done
            node scripts/hosted-bridge-release-gate.cjs --package "$package" "$@"
          }

          verify_bridge_package "laf-bridge@$VERSION"
          if [ "$NPM_TAG" = "latest" ]; then
            verify_bridge_package "laf-bridge@latest" --expect-version "$VERSION"
          else
            latest_version="$(npm view laf-bridge@latest version 2>/dev/null || true)"
            if [ "$latest_version" = "$VERSION" ]; then
              echo "::error::pre-release ${VERSION} is published on laf-bridge@latest; expected npm dist-tag ${NPM_TAG}"
              exit 1
            fi
            echo "::notice::laf-bridge@latest remains ${latest_version:-unpublished}; npm dist-tag ${NPM_TAG} did not move latest"
          fi
