name: Hosted Bridge Deploy Smoke

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Deployed hosted API URL, for example https://office.example.com/api"
        required: true
        type: string
      smoke_mode:
        description: "api validates deployed auth/schema/control-plane; cli also runs npx laf-bridge on the selected GitHub Actions host."
        default: api
        options:
          - api
          - cli
        required: true
        type: choice
      signup:
        description: "Create the smoke user/team before running the smoke."
        default: false
        required: true
        type: boolean
      github_actions_runs_on:
        description: "GitHub Actions runs-on value. Use self-hosted for cli mode when Codex or Claude CLI is installed there."
        default: ubuntu-latest
        required: true
        type: string
      bridge_package:
        description: "Public npm package spec to verify and run, such as laf-bridge@latest or laf-bridge@1.2.3; build metadata is not allowed."
        default: laf-bridge@latest
        required: true
        type: string
      bridge_expected_version:
        description: "Optional npm SemVer that bridge_package or latest must resolve to."
        default: ""
        required: false
        type: string
      browser_origin:
        description: "Optional web origin for credentialed CORS preflight, for example https://app.example.com."
        default: ""
        required: false
        type: string
      repo_url:
        description: "GitHub repo URL used for the smoke project."
        default: "https://github.com/LAF-labs/LAF-Agents-Office"
        required: true
        type: string
  workflow_call:
    inputs:
      api_url:
        description: "Deployed hosted API URL, for example https://office.example.com/api"
        required: true
        type: string
      smoke_mode:
        description: "api validates deployed auth/schema/control-plane; cli also runs npx laf-bridge."
        default: api
        required: false
        type: string
      signup:
        description: "Create the smoke user/team before running the smoke."
        default: false
        required: false
        type: boolean
      github_actions_runs_on:
        description: "GitHub Actions runs-on value. Use self-hosted for cli mode when Codex or Claude CLI is installed there."
        default: ubuntu-latest
        required: false
        type: string
      bridge_package:
        description: "Public npm package spec to verify and run, such as laf-bridge@latest or laf-bridge@1.2.3; build metadata is not allowed."
        default: laf-bridge@latest
        required: false
        type: string
      bridge_expected_version:
        description: "Optional npm SemVer that bridge_package or latest must resolve to."
        default: ""
        required: false
        type: string
      browser_origin:
        description: "Optional web origin for credentialed CORS preflight, for example https://app.example.com."
        default: ""
        required: false
        type: string
      repo_url:
        description: "GitHub repo URL used for the smoke project."
        default: "https://github.com/LAF-labs/LAF-Agents-Office"
        required: false
        type: string
    secrets:
      LAF_SMOKE_EMAIL:
        required: true
      LAF_SMOKE_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: hosted-bridge-deploy-smoke-${{ inputs.api_url }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ${{ inputs.github_actions_runs_on }}
    env:
      LAF_BRIDGE_EXPECT_VERSION: ${{ inputs.bridge_expected_version }}
      LAF_BRIDGE_NPX_PACKAGE: ${{ inputs.bridge_package }}
      LAF_HOSTED_API_URL: ${{ inputs.api_url }}
      LAF_SMOKE_BROWSER_ORIGIN: ${{ inputs.browser_origin }}
      LAF_SMOKE_EMAIL: ${{ secrets.LAF_SMOKE_EMAIL }}
      LAF_SMOKE_MODE: ${{ inputs.smoke_mode }}
      LAF_SMOKE_PASSWORD: ${{ secrets.LAF_SMOKE_PASSWORD }}
      LAF_SMOKE_REPO_URL: ${{ inputs.repo_url }}
      LAF_SMOKE_SIGNUP: ${{ inputs.signup && '1' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: "20"

      - name: Validate smoke inputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/hosted-bridge-deploy-inputs.cjs --github-env

      - name: Verify hosted Bridge schema manifest
        run: npm run hosted-bridge:schema

      - name: Verify public LAF Bridge npx package
        run: npm run hosted-bridge:release-gate

      - name: Validate CLI host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ "${LAF_SMOKE_MODE}" = "cli" ]; then
            if ! command -v git >/dev/null 2>&1; then
              echo "::error::cli mode requires git on the selected GitHub Actions host"
              exit 1
            fi
            if ! command -v codex >/dev/null 2>&1 && ! command -v claude >/dev/null 2>&1; then
              echo "::error::cli mode requires Codex or Claude CLI on the selected GitHub Actions host"
              exit 1
            fi
          fi

      - name: Run hosted Bridge deployed smoke
        run: npm run hosted-bridge:smoke
